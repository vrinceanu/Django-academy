# Local development stack. `docker compose up` (or `docker-compose up`) starts all six services.
# Web: http://localhost:3000   API: http://localhost:8000/api/v1/
# Uploaded files are kept on disk in backend/media/ (staging and production use Cloudflare R2).
name: django

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --queues=celery,media --concurrency=2

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_ORIGIN: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chips}
      POSTGRES_USER: ${POSTGRES_USER:-chips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chips}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chips}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
  web_node_modules:
  web_next:
