# Staging and demo stack on the Azure VM. Served at https://staging.hbcuchip.org:8080
# Images are built by GitHub Actions and pulled from GHCR; IMAGE_TAG is the git SHA.
name: django-academy

x-backend: &backend
  image: ghcr.io/${GHCR_OWNER}/django-academy-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  # Uploaded files live on the VM's disk until staging moves to R2 (M3).
  volumes:
    - media_data:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-staging.hbcuchip.org:8080}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"     # needed only for Let's Encrypt HTTP challenges and redirects
      - "8080:8080" # the staging site
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    <<: *backend

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --queues=celery,media --concurrency=2

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  web:
    image: ghcr.io/${GHCR_OWNER}/django-academy-web:${IMAGE_TAG:-latest}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  media_data:
