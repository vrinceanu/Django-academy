name: Deploy staging

# Every green build of main is deployed to https://staging.hbcuchip.org:8080
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.hbcuchip.org:8080
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Until the staging secrets exist (docs/staging.md), images are built and
      # pushed but the deploy step is skipped instead of failing.
      HAS_STAGING: ${{ secrets.STAGING_HOST != '' && secrets.STAGING_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          tags: ghcr.io/${{ env.OWNER }}/django-academy-api:${{ env.SHA }},ghcr.io/${{ env.OWNER }}/django-academy-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: true
          tags: ghcr.io/${{ env.OWNER }}/django-academy-web:${{ env.SHA }},ghcr.io/${{ env.OWNER }}/django-academy-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Deploy to the Azure VM
        if: env.HAS_STAGING == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy infra/staging/compose.yml infra/staging/Caddyfile infra/staging/deploy.sh "deploy@$SSH_HOST:/opt/django-academy/"
          ssh -i ~/.ssh/deploy "deploy@$SSH_HOST" \
            "echo '$GHCR_READ_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && bash /opt/django-academy/deploy.sh '$SHA'"
      - name: Staging not configured yet
        if: env.HAS_STAGING != 'true'
        run: echo "::notice::Images pushed to GHCR. Add the staging secrets (docs/staging.md) to deploy."
