name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chips
          POSTGRES_USER: chips
          POSTGRES_PASSWORD: chips
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chips" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
          git diff --exit-code openapi.yaml || (echo "Run: python manage.py spectacular --file openapi.yaml" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API client matches the schema
        run: |
          npm run api:generate
          git diff --exit-code lib/api/schema.d.ts || (echo "Run: npm run api:generate" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  stack:
    # M0 exit check: the whole compose stack starts and answers.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300 postgres redis api
      - run: docker compose up -d --build web worker beat
      - name: API health
        run: curl --retry 20 --retry-delay 3 --retry-all-errors -fsS http://localhost:8000/api/v1/health/
      - name: Web home page
        run: curl --retry 40 --retry-delay 3 --retry-all-errors -fsS -o /dev/null http://localhost:3000/
      - name: Worker is up
        run: docker compose exec -T worker celery -A config inspect ping --timeout 10
      - if: failure()
        run: docker compose logs --tail=100
